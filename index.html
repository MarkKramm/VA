<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VA Learning Platform</title>
    <meta
      name="description"
      content="Structured roadmaps that take you from complete beginner to job-ready virtual assistant."
    />
    <meta name="color-scheme" content="light dark" />

    <!--
      Theme applied before first paint.

      This script is deliberately inline and deliberately duplicated: it must run
      BEFORE the stylesheet and the React bundle are parsed, or a learner who chose
      dark mode sees a white flash on every navigation. It cannot import
      `src/app/storage/theme.ts` - that is a module the bundler has not loaded yet -
      so the storage key is written out literally here.

      The key is a constant in `theme.ts`, and the JSON encoding matches what
      `LocalStorageAdapter` writes, because a mismatch would silently produce a
      flash for exactly the users this script exists to serve. If you change one,
      change the other. `src/app/__tests__/theme-bootstrap.test.ts` asserts the two
      agree, so a mismatch fails the test suite rather than shipping.

      NOTE: this comment block is written in HTML comment syntax. It was previously
      written in JSX comment syntax, which is not a comment in HTML at all - the
      browser parsed it as text and rendered the whole block to the learner on every
      page load. `scripts/check-paths.ts` now fails the build if that syntax
      reappears in the built output, and `theme-bootstrap.test.ts` checks the source.
    -->
    <script>
      ;(function () {
        try {
          var stored = window.localStorage.getItem('va:theme')
          var preference = stored ? JSON.parse(stored) : 'system'
          var theme =
            preference === 'light' || preference === 'dark'
              ? preference
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.setAttribute('data-theme', theme)
        } catch (error) {
          /*
           * localStorage can throw in private mode, and a malformed value throws
           * in JSON.parse. Failing silently is correct: the alternative is
           * blocking first paint on a preference.
           *
           * The page still renders correctly in that case. tokens.css carries a
           * `@media (prefers-color-scheme: dark)` fallback on `:root:not([data-theme])`,
           * so a system-dark learner gets the dark palette even when this script never
           * runs. That selector is specificity (0,2,0), which is what lets it beat the
           * light theme's plain `:root` at (0,1,0) — an earlier version wrapped it in
           * `:where()`, which zeroed the specificity and made the fallback dead while
           * looking correct.
           */
        }
      })()
    </script>
  </head>
  <body>
    <!--
      The React app mounts here.

      The fallback text is inside the container rather than beside it, so it is
      replaced on hydration rather than left behind. It is also what a learner sees
      if the JavaScript bundle fails to load, which is a real condition on a slow
      connection - hence an actual explanation rather than a spinner.
    -->
    <div id="root">
      <noscript>
        <div style="padding: 2rem; font-family: system-ui, sans-serif; max-width: 40rem">
          <h1>VA Learning Platform</h1>
          <p>
            This platform needs JavaScript to display the curriculum. The content is also stored in
            this repository as plain files, if you would rather read it there.
          </p>
        </div>
      </noscript>
    </div>

    <!--
      A module script, so it is deferred by default and does not block parsing.
      `crossorigin` matters for the module preload; Vite emits hashed asset names and
      a cross-origin module without this attribute fails to load.
    -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
